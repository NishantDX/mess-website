# Local dev stack: API + MongoDB + Redis, one command.
#   docker compose up --build
# The API reads the rest of its config (Firebase, Razorpay, etc.) from .env.

services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Override just the two service URLs so they point at the containers.
      MONGO_URI: mongodb://mongo:27017/mess
      REDIS_URL: redis://redis:6379
      PORT: 5000
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
